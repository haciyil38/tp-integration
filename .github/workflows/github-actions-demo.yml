name: Tests avec Docker

on: [push]

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Construire l'image Docker
        run: docker build -t tp-addition .

      - name: Lancer le conteneur
        env:
          SECRET_API_TOKEN: ${{ secrets.SECRET_API_TOKEN }}
        run: docker run --rm -e SECRET_API_TOKEN="$SECRET_API_TOKEN" tp-addition
      
      - name: Construire l'image COPY
        run: docker build -t exercice-copy ./exercice-copy

      - name: Vérifier que app.py est présent
        run: docker run --rm exercice-copy ls -la

      - name: Exécuter app.py
        run: docker run --rm exercice-copy python3 app.py
