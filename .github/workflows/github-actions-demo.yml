name: CI/CD ClientHub

on:
  push:
    branches:
      - main

jobs:

  unit-tests:
    name: Tests unitaires
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer les tests unitaires
        run: python -m unittest -v test_app.py


  e2e-tests:
    name: Tests E2E
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Construire l'image Docker
        run: docker build -t clienthub .

      - name: Démarrer l'application
        run: docker run -d -p 5000:5000 --name clienthub clienthub

      - name: Attendre le démarrage de l'application
        run: sleep 5

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer requests et pytest
        run: pip install requests pytest

      - name: Lancer les tests E2E
        run: pytest tests/test_e2e.py -v


  build-and-push:
    name: Build et Push Docker Hub
    runs-on: ubuntu-latest
    needs:
      - unit-tests
      - e2e-tests

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construire l'image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/clienthub:latest .

      - name: Push vers Docker Hub
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/clienthub:latest
  
  deploy:
    name: Deploy sur AWS
    runs-on: ubuntu-latest
    needs:
      - unit-tests
      - e2e-tests
      - build-and-push

    steps:
      - name: Déployer sur la VM AWS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            docker pull wrldofh/clienthub:latest
            docker rm -f myapp || true
            docker run -d --name myapp -p 80:5000 wrldofh/clienthub:latest

      - name: Vérifier le déploiement
        run: |
          sleep 5
          curl --fail http://${{ secrets.AWS_HOST }}/health
