name: Tests unitaires et déploiement

on: [push]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Lancer les tests unitaires
        run: python3 test_addition.py

      - name: Installer sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Envoyer le code sur Ubuntu
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -p "$SSH_PASSWORD" scp -o StrictHostKeyChecking=no -r ./* ubuntu@20.56.74.49:~/HY/tp-integration/
